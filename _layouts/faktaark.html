---
layout: default
---

{% capture pdf_path %}/assets/pdf/{{ page.kode }}.pdf{% endcapture %}

<h1>{{ page.title }}, {{ page.kode }}</h1>

<p>
  Dette faktaarket viser indikatoren "{{ page.title }}"
  i økosystemet {{ page.parent }}.
</p>

<a href="{{ pdf_path | relative_url }}"
   class="btn fs-5 mb-4 mb-md-0"
   target="_blank"
   rel="noopener">
  Åpne faktaarket i ny fane
</a>

<embed class="pdf-viewer"
       src="{{ pdf_path | relative_url }}#view=FitH"
       type="application/pdf">
