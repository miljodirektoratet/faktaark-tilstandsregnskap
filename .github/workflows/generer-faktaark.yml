name: Generer faktaark fra Excel

on:
  push:
    branches-ignore: [main]
    paths:
      - "data/faktaark.xlsx"
      - "scripts/generer_faktaark.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl pyyaml
      - name: Generer md-filer
        run: python scripts/generer_faktaark.py
      - name: Commit til branchen
        if: github.ref != 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Ingen endringer."
          else
            git commit -m "Generer faktaark fra Excel"
            git push
          fi
